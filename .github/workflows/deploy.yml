name: Deploy NVHome (v2.24.9) - SECURITY PATCH (Axios Pin)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v7
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://nvhomes.vn/api
            BACKEND_URL=http://backend:5232
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            cd ~/nvhome || (mkdir -p ~/nvhome && cd ~/nvhome && git clone https://${{ github.actor }}:${{ secrets.GH_PAT }}@github.com/thangninjazz/nvhomes-ver2.git .)
            git remote set-url origin https://${{ github.actor }}:${{ secrets.GH_PAT }}@github.com/thangninjazz/nvhomes-ver2.git
            git fetch origin main
            git reset --hard origin/main
            # 0. Dọn dẹp conatiner cũ và ma (Ghost containers)
            sudo docker compose -p nvhome down || true
            sudo docker rm nvhome_backend_secured nvhome_frontend 33a8c011aa7f_nvhome_db || true
            
            # Đăng nhập GHCR trên VPS để kéo image Private
            echo "${{ secrets.GH_PAT }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            sudo docker compose -p nvhome pull
            sudo docker compose -p nvhome up -d
            sudo docker image prune -f
            
            # Kiểm tra trạng thái cuối (Healthcheck)
            sudo docker compose -p nvhome ps
            
            # Cài đặt và phân quyền cho các script
            chmod +x ~/nvhome/scripts/*.sh
            
            # 1. Giải phóng IP (Nếu lỡ bị chặn)
            sudo fail2ban-client set sshd unbanip --all || true
            
            # 2. Cấu hình Nginx (HSTS Preload)
            sudo cp ~/nvhome/nginx_vps_final.conf /etc/nginx/sites-available/nvhome.conf
            sudo ln -sf /etc/nginx/sites-available/nvhome.conf /etc/nginx/sites-enabled/
            sudo nginx -t && sudo systemctl reload nginx
            
            # 3. Cấu hình Fail2Ban (SSH & Nginx)
            sudo /bin/bash ~/nvhome/scripts/setup_fail2ban_web.sh
            
            # 4. Hardening SSH (Disable Password Auth - SAFE)
            sudo /bin/bash ~/nvhome/scripts/harden_ssh.sh
            
            # 5. Hệ thống Backup & Giám sát (Monitoring)
            chmod +x ~/nvhome/scripts/*.sh
            cp ~/nvhome/scripts/backup_vps.sh ~/backup_vps.sh # Copy ra ngoài để an toàn
            /bin/bash ~/nvhome/scripts/setup_backup.sh
            # 5.1 Run manual backup immediately as requested
            /bin/bash ~/nvhome/scripts/backup_vps.sh
            
            # 6. Tự động cập nhật hệ thống (Unattended Upgrades)
            sudo /bin/bash ~/nvhome/scripts/setup_auto_updates.sh
            
            # 7. Cloudflare UFW Protection (Chỉ cho phép IP Cloudflare truy cập 80/443)
            sudo /bin/bash ~/nvhome/scripts/whitelist_cloudflare.sh
            
            # 8. Vô hiệu hóa Nginx Default Site để tránh xung đột
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo nginx -s reload || true

      - name: Admin Cleanup (One-time or Periodic)
        if: success()
        uses: appleboy/ssh-action@v1.2.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Xóa Admin cũ nếu tồn tại
            sudo docker exec nvhome_db psql -U postgres -d nvhomedb -c "DELETE FROM \"Users\" WHERE \"Email\" = 'nv_super_admin@nvhome.vn';" || true

      - name: Notify Deployment Status
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ${{ job.status == 'success' && '✅' || '❌' }} **DEPLOY STATUS: NVHome (v2.24.2)**
            
            Trạng thái: ${{ job.status == 'success' && 'THÀNH CÔNG' || 'THẤT BẠI' }}
            Khu vực: ${{ github.job }}
            Repository: ${{ github.repository }}
            Xem chi tiết: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

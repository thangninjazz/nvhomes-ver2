services:
  db:
    image: postgres:15-alpine
    container_name: nvhome_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: nvhomedb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nvhome_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nvhomedb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  backend:
    image: ghcr.io/thangninjazz/nvhomes-ver2/backend:latest
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: nvhome_backend
    ports:
      - "127.0.0.1:5232:5232"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=nvhomedb;Username=postgres;Password=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY}
      - NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${NEXT_PUBLIC_RECAPTCHA_SITE_KEY}
    volumes:
      - backend_uploads:/app/wwwroot/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5232/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - nvhome_net
    restart: always

  frontend:
    image: ghcr.io/thangninjazz/nvhomes-ver2/frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nvhome_frontend
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nvhome_net
    restart: always

networks:
  nvhome_net:
    driver: bridge

volumes:
  postgres_data:
  backend_uploads:
